# Runs the formatter over the files that are staged for commit — CONTRIBUTING's
# own command, on the staged subset. Install once with: pre-commit install
#
# The hook repo is pinned by full SHA and the formatter by exact version for the
# same reason the CMake dependency pins are: tags move, SHAs do not (SEC-08).
# 21.1.8 is the version this project's config was measured against; 18.1.8 and
# 19.1.7 produce the identical result on this tree.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 75ca4ad908dc4a99f57921f29b7e6c1521e10b26  # v21.1.8
    hooks:
      - id: clang-format
        args: [--dry-run, --Werror]
        files: \.(cpp|hpp)$
        exclude: ^src/presentation/FontData\.hpp$
